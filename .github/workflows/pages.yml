name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false # never interrupt a deploy mid-flight

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The frontend arrives in step 2 of the build order. Until then this reports
  # plainly that there is nothing to publish, rather than failing red every
  # push or passing green as if it had deployed something.
  check:
    name: is there a site to build
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          if [ -f frontend/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Nada a publicar ainda" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`frontend/package.json\` não existe. O site estático é o passo 2." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: build
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: build
        working-directory: frontend
        env:
          # Static mode: reads the JSON files shipped with the build and makes
          # no API calls. The upload and review screens are compiled out.
          VITE_APP_MODE: static
          # Pages serves the project site under /<repo>/.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
