[project]
name = "gymrats"
version = "0.1.0"
description = "Monthly tally for a GymRats fitness competition, from phone screenshots to a static site"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The API and OCR layers are added in later steps. The tally core has no
# runtime dependencies at all -- that is the point of the layering.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
]
ocr = [
    "pytesseract>=0.3.13",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/gymrats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PT",       # pytest style
]

[tool.ruff.lint.per-file-ignores]
# Tests import the local conftest helpers, which is not a third-party import.
"tests/*" = ["E402"]
